<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Sportswear - Cửa Hàng Thể Thao Cao Cấp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .product-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
        .gradient-text { background: linear-gradient(90deg, #2563eb, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>

    <header class="bg-white sticky top-0 z-50 shadow-sm">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black gradient-text tracking-tighter">ELITE SPORT</h1>
            <nav class="hidden md:flex space-x-8 font-medium text-gray-600">
                <a href="#" class="hover:text-blue-600">Trang chủ</a>
                <a href="#" class="hover:text-blue-600">Sản phẩm</a>
                <a href="#" class="hover:text-blue-600">Liên hệ</a>
            </nav>
            <button class="bg-blue-600 text-white px-5 py-2 rounded-full font-semibold hover:bg-blue-700 transition">Giỏ hàng</button>
        </div>
    </header>

    <section class="bg-slate-900 text-white py-16">
        <div class="container mx-auto px-6 text-center">
            <h2 class="text-4xl md:text-5xl font-bold mb-4">Bứt Phá Giới Hạn</h2>
            <p class="text-slate-400 text-lg mb-8">Bộ sưu tập đồ thể thao chuyên nghiệp mới nhất 2024</p>
        </div>
    </section>

    <main class="container mx-auto px-6 py-12">
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </main>

    <div id="orderModal" class="hidden fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden">
            <div class="p-8 text-center">
                <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                    </svg>
                </div>
                <h3 class="text-2xl font-bold text-gray-900 mb-2">Đặt hàng nhanh</h3>
                <p id="productInfo" class="text-gray-600 mb-8 italic"></p>
                
                <a id="checkoutLink" href="#" target="_blank" 
                   class="block w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 transition shadow-lg shadow-blue-200">
                    TIẾP TỤC ĐẾN FORM ĐẶT HÀNG
                </a>
                
                <button onclick="closeModal()" class="mt-4 text-gray-400 font-medium hover:text-gray-600">Hủy bỏ</button>
            </div>
        </div>
    </div>

    <script>
        // Danh sách 9 món đồ thể thao với link ảnh rõ ràng
        const products = [
            { id: 1, name: "Giày Chạy Bộ Pegasus 40", price: "3.200.000đ", img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&q=80&w=600" },
            { id: 2, name: "Áo Đấu CLB Real Madrid", price: "1.850.000đ", img: "https://www.ace.co.uk/images/products/36738701_l.jpg" },
            { id: 3, name: "Quả Bóng Al Rihla FIFA", price: "2.100.000đ", img: "https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&q=80&w=600" },
            { id: 4, name: "Vợt Tennis Wilson Pro", price: "5.400.000đ", img: "https://encrypted-tbn3.gstatic.com/images?q=tbn:ANd9GcRRQqH__9ca_G4P8nhY130AWPpTb-RIkp6oXn-UD-N4xnNXSDoKtyFd0TKx8JMZ" },
            { id: 5, name: "Thảm Yoga Chống Trượt", price: "450.000đ", img: "https://images.unsplash.com/photo-1592432678016-e910b452f9a2?auto=format&fit=crop&q=80&w=600" },
            { id: 6, name: "Bộ Tạ Gang 20kg", price: "950.000đ", img: "https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&q=80&w=600" },
            { id: 7, name: "Kính Bơi Arena Cao Cấp", price: "680.000đ", img: "https://encrypted-tbn3.gstatic.com/images?q=tbn:ANd9GcTV_iQgRYh-mKzFy9vKuop8EdLmoTXbFQdV3H4HZHLfRkdpaDOKC88E769CYL2m" },
            { id: 8, name: "Găng Tay Boxing Venum", price: "1.450.000đ", img: "https://images.unsplash.com/photo-1549719386-74dfcbf7dbed?auto=format&fit=crop&q=80&w=600" },
            { id: 9, name: "Ba Lô Thể Thao Nike", price: "890.000đ", img: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&q=80&w=600" }
        ];

        // Link Google Form của bạn
        const GOOGLE_FORM_URL = "https://forms.gle/WAkRUwX5c6VEfBJ26";

        const grid = document.getElementById('product-grid');
        products.forEach(p => {
            grid.innerHTML += `
                <div class="product-card bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex flex-col">
                    <div class="overflow-hidden rounded-xl mb-4 h-64">
                        <img src="${p.img}" alt="${p.name}" class="w-full h-full object-cover">
                    </div>
                    <h3 class="text-lg font-bold text-gray-800 mb-1">${p.name}</h3>
                    <p class="text-blue-600 font-bold text-xl mb-4">${p.price}</p>
                    <button onclick="openModal('${p.name}')" 
                        class="mt-auto w-full py-3 bg-gray-900 text-white font-semibold rounded-xl hover:bg-blue-600 transition duration-300 shadow-md">
                        Mua ngay
                    </button>
                </div>
            `;
        });

        function openModal(name) {
            document.getElementById('productInfo').innerText = "Sản phẩm chọn mua: " + name;
            document.getElementById('checkoutLink').href = GOOGLE_FORM_URL;
            document.getElementById('orderModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('orderModal').classList.add('hidden');
        }
    </script>
</body>
</html>
